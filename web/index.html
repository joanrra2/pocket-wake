<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="referrer" content="no-referrer">
<title>Pocket Wake</title>
<meta name="description" content="Wake your PCs from anywhere through your Pocket AdBlock board.">
<meta name="theme-color" content="#f4fbfa" media="(prefers-color-scheme: light)">

<div id="app" aria-live="polite">
  <noscript><p class="noscript">Pocket Wake needs JavaScript.</p></noscript>
</div>

<dialog id="add-dialog" aria-labelledby="add-title">
  <form id="add-form" method="dialog" novalidate>
    <h2 id="add-title">Add a PC</h2>
    <label class="field">
      <span class="field-label">Name on the board</span>
      <input id="add-name" name="name" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="PC-NAME" maxlength="64" required>
      <span class="field-help" id="add-help">Case-sensitive, as in the board's Wake-on-LAN list</span>
    </label>
    <p class="mono muted" id="add-topic"></p>
    <div class="dialog-actions">
      <button type="button" class="btn text" data-action="add-cancel">Cancel</button>
      <button type="submit" class="btn text" id="add-ok">Add</button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
