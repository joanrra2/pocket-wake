name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  debug:
    name: Tests and debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Debug APK
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: pocket-wake-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    name: Signed release APK and app bundle
    if: startsWith(github.ref, 'refs/tags/v')
    needs: debug
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    env:
      KEYSTORE_BASE64: ${{ secrets.POCKETWAKE_KEYSTORE_BASE64 }}
      POCKETWAKE_KEYSTORE_PASSWORD: ${{ secrets.POCKETWAKE_KEYSTORE_PASSWORD }}
      POCKETWAKE_KEY_ALIAS: ${{ secrets.POCKETWAKE_KEY_ALIAS }}
      POCKETWAKE_KEY_PASSWORD: ${{ secrets.POCKETWAKE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Check signing secrets
        run: |
          missing=""
          for v in KEYSTORE_BASE64 POCKETWAKE_KEYSTORE_PASSWORD POCKETWAKE_KEY_ALIAS POCKETWAKE_KEY_PASSWORD; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (see README, 'Release signing')"
            exit 1
          fi

      - name: Restore keystore
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "POCKETWAKE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # The APK goes on the GitHub release; the app bundle (.aab) is what Google Play
      # takes. Both are signed with the same key, so either one updates the other.
      - name: Release APK and app bundle
        run: ./gradlew assembleRelease bundleRelease

      - name: Name the APK and app bundle
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          aab=app/build/outputs/bundle/release/app-release.aab
          [ -f "$apk" ] || { echo "::error::No signed APK was produced"; ls -la app/build/outputs/apk/release; exit 1; }
          [ -f "$aab" ] || { echo "::error::No app bundle was produced"; ls -la app/build/outputs/bundle/release; exit 1; }
          cp "$apk" "pocket-wake-${GITHUB_REF_NAME}.apk"
          cp "$aab" "pocket-wake-${GITHUB_REF_NAME}.aab"
          sha256sum "pocket-wake-${GITHUB_REF_NAME}.apk" | tee "pocket-wake-${GITHUB_REF_NAME}.apk.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: pocket-wake-${{ github.ref_name }}
          path: pocket-wake-${{ github.ref_name }}.apk*

      # For uploading to Google Play by hand (Play Console → Test and release). Not
      # attached to the GitHub release: an .aab can't be installed on a phone.
      - uses: actions/upload-artifact@v7
        with:
          name: pocket-wake-${{ github.ref_name }}-play
          path: pocket-wake-${{ github.ref_name }}.aab
          if-no-files-found: error

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tags with a suffix (v0.1.0-beta.1, v0.2.0-rc.1) are pre-releases.
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            "pocket-wake-${GITHUB_REF_NAME}.apk" "pocket-wake-${GITHUB_REF_NAME}.apk.sha256" \
            --title "Pocket Wake ${GITHUB_REF_NAME}" --generate-notes $pre

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
