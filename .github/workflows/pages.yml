name: Web app

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["web/**"]
  workflow_dispatch:

jobs:
  test:
    name: Web tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Unit tests
        working-directory: web
        run: node --test

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Collect the site (without tests)
        run: |
          mkdir _site
          cp -r web/index.html web/privacy.html web/manifest.webmanifest web/sw.js web/css web/js web/icons web/vendor _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
